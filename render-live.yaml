# Mithilana live production Render Blueprint
# Do not deploy until live payment, webhook, WhatsApp, Google and domain settings are ready.
services:
  - type: web
    name: apanmithilana
    runtime: node
    plan: free
    buildCommand: mkdir -p app && tar -xzf website.tar.gz -C app && cd app && npm ci
    startCommand: cd app && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: live
      - key: LIVE_ORDERS_ENABLED
        value: "true"
      - key: CSP_MODE
        value: enforce
      - key: DB_SSL
        value: "false"
      - key: PUBLIC_ORIGIN
        value: https://www.apanmithilana.com
      - key: DATABASE_URL
        fromDatabase:
          name: apanmithilana-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ORDER_STATUS_TEMPLATE
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        value: authentication_code_copy_code_button
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US

databases:
  - name: apanmithilana-db
    plan: free
