# Mithilana live production Render Blueprint
# Google and database must be configured. Razorpay is optional until online payments are enabled.
services:
  - type: web
    name: apanmithilana
    runtime: node
    plan: free
    buildCommand: mkdir -p app && tar --no-same-owner -xzf website.tar.gz -C app && cd app && npm ci
    startCommand: cd app && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: live
      - key: LIVE_ORDERS_ENABLED
        value: "true"
      - key: CSP_MODE
        value: enforce
      - key: DB_SSL
        value: "false"
      - key: PUBLIC_ORIGIN
        value: https://www.apanmithilana.com
      - key: DATABASE_URL
        fromDatabase:
          name: apanmithilana-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Add Razorpay live credentials later in Render environment settings.
      # WhatsApp Cloud API is intentionally not configured.
      - key: WHATSAPP_SUPPORT_NUMBER
        value: "919220866696"

databases:
  - name: apanmithilana-db
    plan: free
