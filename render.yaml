# Test deployment. Connect this repository as a Render Blueprint.
services:
  - type: web
    name: mithilana-test
    runtime: node
    plan: free
    buildCommand: tar -xzf website.tar.gz --skip-old-files --no-same-owner && npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: test
      - key: LIVE_ORDERS_ENABLED
        value: "false"
      - key: DB_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mithilana-test-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ORDER_STATUS_TEMPLATE
        sync: false
databases:
  - name: mithilana-test-db
    plan: free
